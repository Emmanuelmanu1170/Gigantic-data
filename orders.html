<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — All User Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins", sans-serif; }
body { background:#f4f7ff; color:#0a2a66; }

header {
  background:#0a2a66; color:#fff; padding:15px 8%;
  display:flex; justify-content:space-between; align-items:center;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
}
header h1 { font-size:1.4rem; }

.container { padding:40px 8%; margin-top:20px; }

.search-box { margin-bottom:20px; text-align:right; }
.search-box input { padding:10px; width:260px; border-radius:6px; border:1px solid #ccc; font-size:0.9rem; }

.filter-section { margin-bottom:20px; text-align:left; }
.filter-section select { padding:10px; border-radius:6px; border:1px solid #ccc; font-size:0.9rem; }

table {
  width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden;
  box-shadow:0 6px 15px rgba(0,0,0,0.05);
}
th, td { padding:14px; text-align:center; border-bottom:1px solid #eef3ff; font-size:0.9rem; }
th { background:#0a2a66; color:#fff; }
tr:nth-child(even) { background:#f0f5ff; }

.action-btn { padding:6px 8px; border:none; border-radius:6px; color:#fff; cursor:pointer; margin:2px; font-size:0.8rem; }
.processing { background:#f39c12; }
.progress { background:#3498db; }
.completed { background:#27ae60; }
.canceled { background:#e74c3c; }
.delete-btn { background:#111; color:#fff; }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <button onclick="location.href='admin_dashboard.html'" style="padding:6px 10px; border:none; border-radius:6px; background:#1e90ff; color:#fff; cursor:pointer;">← Back</button>
    <h1>Admin Dashboard — All User Orders</h1>
  </div>
</header>

<div class="container">

<div class="filter-section">
  <label for="dateFilter">Show orders from:</label>
  <select id="dateFilter">
    <option value="all">All</option>
    <option value="7">Last 7 days</option>
    <option value="14">Last 14 days</option>
  </select>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search by email, network, price, plan, status...">
</div>

<table id="ordersTable">
  <thead>
    <tr>
      <th>Network</th>
      <th>Plan</th>
      <th>Price</th>
      <th>Recipient</th>
      <th>Email</th>
      <th>Date</th>
      <th>Time</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmiippVd5uyAb51U9upNNpSvJk0lXSNg4",
  authDomain: "gigantic-data.firebaseapp.com",
  databaseURL: "https://gigantic-data-default-rtdb.firebaseio.com",
  projectId: "gigantic-data",
  storageBucket: "gigantic-data.firebasestorage.app",
  messagingSenderId: "727845403550",
  appId: "1:727845403550:web:e3c3a40ce615aaaca9748f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const tbody = document.querySelector("#ordersTable tbody");
const searchInput = document.getElementById("searchInput");
const dateFilter = document.getElementById("dateFilter");

let allOrders = [];

// Admin login check
onAuthStateChanged(auth, user => {
  if(user && user.email === "alenacloft0@gmail.com"){
    listenAllUserOrders();
  } else {
    window.location.href = "login.html";
  }
});

// Listen all user orders
function listenAllUserOrders(){
  const ordersRef = ref(db, "userOrders");
  onValue(ordersRef, snapshot => {
    tbody.innerHTML = "";
    const data = snapshot.val() || {};
    allOrders = [];

    Object.entries(data).forEach(([uid, userOrders])=>{
      Object.entries(userOrders).forEach(([orderId, order])=>{
        if(order.orders && order.orders.length>0){
          order.orders.forEach(item=>{
            allOrders.push({...item, email: order.email || "-", status: order.status || "Pending", timestamp: order.timestamp, id: orderId, uid});
          });
        } else {
          allOrders.push({
            network: order.network || "-",
            plan: order.plan || "-",
            price: order.price || "-",
            recipient: order.recipient || "-",
            email: order.email || "-",
            status: order.status || "Pending",
            timestamp: order.timestamp,
            id: orderId,
            uid
          });
        }
      });
    });

    renderTable();
  });
}

// Render table
function renderTable(){
  let entries = [...allOrders];

  const filterDays = dateFilter.value;
  const now = Date.now();
  if(filterDays !== "all"){
    const daysMs = parseInt(filterDays)*24*60*60*1000;
    entries = entries.filter(order => order.timestamp && (now - order.timestamp <= daysMs));
  }

  const searchText = searchInput.value.toLowerCase();
  if(searchText){
    entries = entries.filter(order=>{
      return (
        (order.email||"").toLowerCase().includes(searchText) ||
        (order.network||"").toLowerCase().includes(searchText) ||
        (order.plan||"").toLowerCase().includes(searchText) ||
        (order.status||"").toLowerCase().includes(searchText) ||
        (order.recipient||"").toLowerCase().includes(searchText) ||
        (order.price||"").toString().includes(searchText)
      );
    });
  }

  entries.sort((a,b)=> (b.timestamp||0) - (a.timestamp||0));
  tbody.innerHTML = "";

  entries.forEach(order=>{
    addOrderRow(order);
  });
}

// Add order row
function addOrderRow(order){
  const dateStr = order.timestamp ? new Date(order.timestamp).toLocaleDateString() : '';
  const timeStr = order.timestamp ? new Date(order.timestamp).toLocaleTimeString() : '';
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${order.network}</td>
    <td>${order.plan}</td>
    <td>${order.price}</td>
    <td>${order.recipient}</td>
    <td>${order.email}</td>
    <td>${dateStr}</td>
    <td>${timeStr}</td>
    <td><b>${order.status}</b></td>
    <td>
      <button class="action-btn processing" onclick="updateStatus('${order.id}','Processing','${order.uid}')">Processing</button>
      <button class="action-btn progress" onclick="updateStatus('${order.id}','In Progress','${order.uid}')">In Progress</button>
      <button class="action-btn completed" onclick="updateStatus('${order.id}','Completed','${order.uid}')">Completed</button>
      <button class="action-btn canceled" onclick="updateStatus('${order.id}','Canceled','${order.uid}')">Canceled</button>
      <button class="action-btn delete-btn" onclick="deleteOrder('${order.id}','${order.uid}')">Delete</button>
    </td>
  `;
  tbody.appendChild(tr);
}

// Event listeners
searchInput.addEventListener("keyup", renderTable);
dateFilter.addEventListener("change", renderTable);

// Update status
window.updateStatus = function(id, status, uid){
  update(ref(db, `userOrders/${uid}/${id}`), { status })
    .then(()=> console.log("Status updated for user", uid))
    .catch(err=> alert(err.message));
};

// Delete order
window.deleteOrder = function(id, uid){
  if(confirm("Delete this order permanently?")){
    remove(ref(db, `userOrders/${uid}/${id}`))
      .then(()=> console.log("Order deleted for user", uid))
      .catch(err=> alert(err.message));
  }
};
</script>

</body>
</html>
